# Auditoría de dependencias (ADR-0004). Se ejecuta con:
#   cargo deny --manifest-path prototypes/kick-console/Cargo.toml check
# y, cuando el workspace tenga dependencias externas, también sobre la raíz.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono sin mantenimiento; el prototipo solo lo usa para la hora de la consola. Se sustituirá al migrar (la librería de tiempo se decide en F1)." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
