name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup >= 1.28 ya no instala solo la toolchain de rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            prototypes/kick-console
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask docs-check
      - run: cargo fmt --check --manifest-path prototypes/kick-console/Cargo.toml
      - run: cargo clippy --manifest-path prototypes/kick-console/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path prototypes/kick-console/Cargo.toml --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: prototypes/kick-console/Cargo.toml
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete .
