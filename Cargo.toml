[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Los prototipos tienen su propio Cargo.lock y no forman parte del workspace.
exclude = ["prototypes/kick-console"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
syon-domain = { path = "crates/syon-domain" }
syon-app = { path = "crates/syon-app" }
syon-storage-toml = { path = "crates/syon-storage-toml" }
syon-storage-credentials = { path = "crates/syon-storage-credentials" }
syon-platform-kick = { path = "crates/syon-platform-kick" }
syon-platform-twitch = { path = "crates/syon-platform-twitch" }
syon-engine = { path = "crates/syon-engine" }

# Dependencias externas (ADR-0004): cada una tiene su fila en docs/deps.md.
tokio = { version = "1", default-features = false, features = ["sync"] }
log = "0.4"
# Registro a consola y archivo (ADR-0006); con sus funciones por defecto, que traen jiff y regex.
env_logger = "0.11"
# Formato de settings.toml (ADR-0008): solo lo usa syon-storage-toml; syon-app no depende de serde.
serde = { version = "1", features = ["derive"] }
# Interpretación tolerante de los datos de las plataformas (ADR-0013): solo los adaptadores lo usan.
serde_json = "1"
# Cliente HTTP del OAuth y de las APIs de las plataformas (ADR-0014); rustls en lugar de OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# PKCE de Kick (ADR-0014): hash SHA-256, base64 sin relleno y bytes aleatorios.
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
# WebSocket del feed de Kick y, después, de EventSub de Twitch (ADR-0015); TLS con rustls.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# Solo `SinkExt` y `StreamExt` para leer y escribir en el WebSocket.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
